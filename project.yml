name: Anicca
options:
  bundleIdPrefix: com.screenseiji
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false
  postGenCommand: ""

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_LANGUAGE: en
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Secrets.xcconfig
  Release: Secrets.xcconfig

packages:
  Supabase:
    url: https://github.com/supabase-community/supabase-swift
    from: 2.0.0
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios
    from: 5.43.0 # the first release that supports RevenueCat's Test Store (test_ keys)
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 7.0.0

targets:
  Anicca:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Anicca
        excludes:
          - "Resources/SupabaseSetup.md"
          - "Anicca.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.screenseiji.anicca
        PRODUCT_NAME: Anicca
        # iPhone only. Must be set here on the target: XcodeGen's iOS preset adds "1,2" at target
        # level, which beats the project-level value, and a portrait-only iPad build is rejected
        # by App Store Connect (error 90474: iPad multitasking needs all four orientations).
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: P788RWL6YN
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Anicca/Anicca.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_FILE: Anicca/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        SWIFT_OBJC_BRIDGING_HEADER: ""
    scheme:
      testTargets: [AniccaTests]
      gatherCoverageData: false
    dependencies:
      - package: Supabase
        product: Supabase
      - package: RevenueCat
        product: RevenueCat
      - package: GoogleSignIn
        product: GoogleSignIn
      - sdk: AuthenticationServices.framework
      - sdk: StoreKit.framework
      - sdk: SafariServices.framework
      - sdk: UserNotifications.framework
      - sdk: PDFKit.framework

  # Unit tests for the emotion library, matcher and insights. The model and service files are
  # compiled straight into the bundle (no app host), so RevenueCat and Supabase never start.
  AniccaTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AniccaTests
      - path: Anicca/Models/Emotion.swift
      - path: Anicca/Models/EmotionLibrary.swift
      - path: Anicca/Models/EmotionLibrary+Legacy.swift
      - path: Anicca/Models/EmotionZone.swift
      - path: Anicca/Models/EmotionLibrary+Integrity.swift
      - path: Anicca/Models/EmotionSelection.swift
      - path: Anicca/Models/EnergyCenter.swift
      - path: Anicca/Models/CheckIn.swift
      - path: Anicca/Models/PlanTier.swift
      - path: Anicca/Models/UserID.swift
      - path: Anicca/Models/UserProfile.swift
      - path: Anicca/Models/AppError.swift
      - path: Anicca/Models/AuthLink.swift
      - path: Anicca/Models/PasswordRules.swift
      - path: Anicca/Models/PasswordResetRequest.swift
      - path: Anicca/ViewModels/SetNewPasswordViewModel.swift
      - path: Anicca/Services/LocalCheckInStore.swift
      - path: Anicca/Services/EmotionMatcher.swift
      - path: Anicca/Services/InsightsService.swift
      - path: Anicca/Theme/AniccaTheme.swift
      - path: Anicca/Extensions/Color+Hex.swift
      - path: Anicca/Config/Strings.swift
      - path: Anicca/Config/AppConfig.swift
      - path: Anicca/Config/RevenueCatKey.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.screenseiji.anicca.tests
        DEVELOPMENT_TEAM: P788RWL6YN
        CODE_SIGN_STYLE: Automatic
